<!doctype html>
<html lang="sr-Latn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMART-HERZ · Preuzimanje API ključa</title>
<style nonce="__NONCE__">
  body { font: 17px/1.5 system-ui, sans-serif; color: #17332d; background: #f4f7f5; margin: 0; }
  main { max-width: 560px; margin: 10vh auto; padding: 32px; background: white; border-radius: 12px; }
  h1 { font-size: 26px; margin-top: 0; }
  label { display: block; margin: 20px 0 6px; }
  input, textarea, button { box-sizing: border-box; font: inherit; padding: 12px; border-radius: 6px; }
  input, textarea { width: 100%; border: 1px solid #a5b5ae; }
  button { margin-top: 16px; border: 0; background: #175c48; color: white; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  textarea { min-height: 100px; font-family: monospace; }
  #status { font-weight: 600; }
</style>
<main>
  <h1>Preuzimanje API ključa</h1>
  <p>SMART-HERZ / SMART ERA</p>
  <p>Unesite PIN da biste preuzeli ključ. Link se može iskoristiti samo jednom.</p>
  <form id="form">
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required>
    <button id="submit" type="submit">Preuzmi ključ</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <label for="key">API ključ</label>
    <textarea id="key" readonly spellcheck="false"></textarea>
    <p>Sačuvajte ključ u konfiguraciji svog sistema i šaljite ga kroz zaglavlje <code>X-API-Key</code>. Ključ ostaje važeći i nakon iskorišćavanja ovog linka.</p>
  </section>
</main>
<script nonce="__NONCE__">
  const token = location.hash.slice(1);
  history.replaceState(null, '', location.pathname);
  const form = document.getElementById('form');
  const status = document.getElementById('status');
  const submit = document.getElementById('submit');
  if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
    status.textContent = 'Link nije potpun. Otvorite ceo link koji ste dobili.';
    submit.disabled = true;
  }
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    submit.disabled = true;
    status.textContent = 'Provera…';
    try {
      const response = await fetch('/api/v1/integration/key-links/redeem', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, cache: 'no-store', credentials: 'omit',
        body: JSON.stringify({token, pin: document.getElementById('pin').value})
      });
      const body = await response.json();
      if (!response.ok) {
        status.textContent = typeof body.detail === 'string' ? body.detail : 'Proverite uneti PIN.';
        submit.disabled = response.status === 410;
        return;
      }
      document.getElementById('key').value = body.api_key;
      document.getElementById('result').hidden = false;
      form.hidden = true;
      document.getElementById('pin').value = '';
      status.textContent = 'Ključ je preuzet. Ovaj link više ne može da se koristi.';
    } catch {
      status.textContent = 'Veza je prekinuta. Pokušajte ponovo. Ako je link već iskorišćen, zatražite novi.';
      submit.disabled = false;
    }
  });
</script>
</html>
